<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Existing Vite Icon (Strictly Unchanged) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Mobile and PWA Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#174A7E" />
    <meta name="description" content="JanNigrani helps citizens report problems and keeps communities safe. Fast, secure, and easy to use." />

    <!-- Typography: Inter (Sans-Serif) and Playfair Display (Serif) -->

  <body>
    <!-- Real Language Translator Feature for 13+ Indian Languages -->
    <div id="google_translate_element" style="text-align: right; padding: 10px; background-color: #F5F8FA; border-bottom: 1px solid #D9E1E7;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          // Strictly limits translation to English and major Indian languages
          includedLanguages: 'hi,mr,bn,te,ta,ur,gu,kn,ml,pa,or,as,mai,sa,en',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Existing Application Logic (Strictly Unchanged) -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
